<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Accessible enterprise UI components</title><desc id="desc">Component showcase showing buttons, search, status chips, accessible focus, a data table, and empty states in a light admin design system.</desc><rect width="1200" height="720" rx="24" fill="#f5f5f8"/><text x="54" y="70" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#777887">DESIGN SYSTEM / COMPONENTS</text><text x="54" y="116" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700" fill="#20212a">Consistent by design</text><text x="54" y="145" font-family="Inter,Arial,sans-serif" font-size="15" fill="#777887">Reusable controls, clear states, and accessible feedback.</text><rect x="54" y="180" width="1092" height="176" rx="18" fill="#fff" stroke="#e4e3eb"/><text x="82" y="216" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#20212a">Buttons and controls</text><rect x="82" y="239" width="144" height="42" rx="12" fill="#6842e8"/><text x="154" y="265" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">Primary action</text><rect x="240" y="239" width="144" height="42" rx="12" fill="#fff" stroke="#dcdbe4"/><text x="312" y="265" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#333440">Secondary</text><rect x="398" y="235" width="152" height="50" rx="15" fill="#fff" stroke="#6842e8" stroke-width="2.5"/><rect x="403" y="240" width="142" height="40" rx="11" fill="#f1edff"/><text x="474" y="265" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#5131b5">Visible focus</text><rect x="566" y="239" width="172" height="42" rx="12" fill="#f0eff4"/><text x="652" y="265" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#a0a0ac">Disabled action</text><rect x="756" y="239" width="354" height="42" rx="12" fill="#fff" stroke="#dcdbe4"/><circle cx="779" cy="258" r="6" fill="none" stroke="#777887" stroke-width="1.5"/><path d="M784 263l5 5" stroke="#777887" stroke-width="1.5"/><text x="800" y="264" font-family="Inter,Arial,sans-serif" font-size="13" fill="#777887">Search users, projects...</text><text x="54" y="403" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#20212a">Status and feedback</text><rect x="54" y="425" width="530" height="104" rx="16" fill="#fff" stroke="#e4e3eb"/><rect x="78" y="451" width="116" height="30" rx="15" fill="#e7f7ee"/><circle cx="94" cy="466" r="4" fill="#14885a"/><text x="106" y="470" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#176746">Operational</text><rect x="207" y="451" width="104" height="30" rx="15" fill="#fff3dc"/><circle cx="223" cy="466" r="4" fill="#b77712"/><text x="235" y="470" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#8d5a0d">Attention</text><rect x="324" y="451" width="94" height="30" rx="15" fill="#fdebed"/><circle cx="340" cy="466" r="4" fill="#c53b4b"/><text x="352" y="470" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#a52b3a">Failed</text><text x="78" y="506" font-family="Inter,Arial,sans-serif" font-size="12" fill="#777887">Status uses both color and text labels.</text><rect x="604" y="425" width="542" height="104" rx="16" fill="#e8f7ef"/><circle cx="635" cy="458" r="11" fill="#14885a"/><path d="M630 458l4 4 7-8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><text x="658" y="455" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#1b4937">Changes saved</text><text x="658" y="478" font-family="Inter,Arial,sans-serif" font-size="12" fill="#356c54">Your workspace settings have been updated.</text><text x="54" y="573" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#20212a">Data table</text><rect x="54" y="592" width="1092" height="100" rx="14" fill="#fff" stroke="#e4e3eb"/><path d="M54 634H1146M54 662H1146" stroke="#e8e7ee"/><rect x="54" y="592" width="1092" height="42" rx="14" fill="#faf9fc"/><rect x="54" y="620" width="1092" height="14" fill="#faf9fc"/><g font-family="Inter,Arial,sans-serif" font-size="12" fill="#777887"><text x="78" y="618">PROJECT</text><text x="450" y="618">OWNER</text><text x="710" y="618">STATUS</text><text x="970" y="618">UPDATED</text></g><g font-family="Inter,Arial,sans-serif" font-size="13" fill="#353641"><text x="78" y="652">Customer portal</text><text x="450" y="652">Alex Morgan</text><text x="710" y="652">Active</text><text x="970" y="652">Today, 10:42</text><text x="78" y="681">Analytics workspace</text><text x="450" y="681">Sam Rivera</text><text x="710" y="681">Review</text><text x="970" y="681">Yesterday</text></g></svg>